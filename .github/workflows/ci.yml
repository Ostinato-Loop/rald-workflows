name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify report files exist
        run: |
          echo "=== RALD Workflows — Report Repository ===" 
          echo "Listing reports directory:"
          ls -la reports/ 2>/dev/null || echo "(reports dir not yet created)"
          echo "Listing root markdown files:"
          ls -la *.md 2>/dev/null || echo "(no root markdown)"
          echo "CI: validation complete"
