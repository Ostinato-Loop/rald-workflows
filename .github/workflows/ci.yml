name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# RALD Canonical CI Template
#
# npm workers  (rald-auth-core, loop-crm, rald-search, rald-notify, rald-realtime):
#   copy jobs.ci — npm install, npm run typecheck / type-check
#
# pnpm monorepos (loop, messenger, rald):
#   copy jobs.typecheck — pnpm/action-setup@v4, pnpm run typecheck
#
# Vite frontends (rald-auth-ui, rald-identity):
#   copy typecheck + build jobs, set VITE_* env vars in build step
#
# Rules:
#   NEVER use || echo "skipping" — failures must be real failures
#   NEVER skip typecheck silently
#   Security audit is always continue-on-error: true (informational only)
#   Deploy workflows are SEPARATE — CI only validates, never deploys

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
